services:
  backend:
    build: ./apps/backend
    container_name: pms-backend
    restart: always
    env_file:
      - ./apps/backend/.env
    environment:
      APP_ENV: ${APP_ENV:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://gmsoluciondigital.com,https://www.gmsoluciondigital.com}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-https://gmsoluciondigital.com}
      MERCADOPAGO_WEBHOOK_URL: ${MERCADOPAGO_WEBHOOK_URL:-https://api.gmsoluciondigital.com/api/pms/mercadopago/webhook}
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./apps/backend/app/static:/app/app/static

  frontend:
    build:
      context: ./apps/frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.gmsoluciondigital.com}
    container_name: pms-frontend
    restart: always
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - backend

volumes:
  # We can keep this or remove it, but it's not used anymore for postgres
  postgres_data:
